name: Optimize product images

on:
  push:
    branches:
      - main
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '.github/workflows/optimize-images.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-product-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install --upgrade Pillow

      - name: Convert and organize catalog images
        run: python .github/scripts/optimize_images.py

      - name: Commit optimized images and updated page links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Optimize and organize product images as WebP"
            git push
          fi
